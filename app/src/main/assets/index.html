<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#fff7fa"><title>Vibely Panda Teddy</title>
<style>
:root{--pink:#ff8eae;--ink:#493d4a;--cream:#fff7fa}*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#fff7fa,#f1eaff);font-family:system-ui,-apple-system,sans-serif;color:var(--ink)}header{padding:22px 20px 8px;display:flex;justify-content:space-between;align-items:center}h1{font-size:22px;margin:0}small{color:#9a8295}.pill{background:#fff;border-radius:30px;padding:9px 13px;box-shadow:0 4px 18px #6e4c6615}.tabs{display:flex;gap:8px;padding:12px 18px}.tab,button{border:0;border-radius:18px;padding:11px 15px;font-weight:700;background:white;color:var(--ink)}.tab.active,button.primary{background:var(--pink);color:white}.scene{margin:8px 16px;background:linear-gradient(#dff4ff 0 57%,#c8e8c4 57%);border-radius:30px;min-height:330px;position:relative;overflow:hidden;box-shadow:0 12px 30px #72516a20}.sun{position:absolute;right:28px;top:22px;width:48px;height:48px;background:#ffe49a;border-radius:50%}.pet{position:absolute;left:50%;top:48%;transform:translate(-50%,-50%);font-size:128px;filter:drop-shadow(0 12px 5px #6b566633);animation:bob 2.4s ease-in-out infinite;user-select:none}.pet.sleep{animation:none;transform:translate(-50%,-50%) rotate(8deg)}@keyframes bob{0%,100%{translate:0 0}50%{translate:0 -10px}}.floor{position:absolute;bottom:0;left:0;right:0;height:35%;background:radial-gradient(ellipse,#ffffff80,transparent 65%)}.bubble{position:absolute;top:18px;left:18px;background:#fff;padding:10px 14px;border-radius:18px;font-size:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 16px}.stat{background:#fff;border-radius:18px;padding:12px;text-align:center;box-shadow:0 5px 15px #72516a0d}.bar{height:7px;border-radius:8px;background:#eee;margin-top:7px;overflow:hidden}.bar i{display:block;height:100%;background:#ff91b1;border-radius:8px}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;padding:4px 16px}.act{padding:13px 3px;border-radius:18px;background:white;text-align:center;font-size:13px}.act b{display:block;font-size:25px;margin-bottom:4px}.panel{margin:14px 16px;background:#fff;border-radius:22px;padding:16px}.panel h3{margin:0 0 10px}.bottom{display:flex;justify-content:space-around;padding:14px;background:#fff;position:sticky;bottom:0;border-radius:22px 22px 0 0}.bottom span{font-size:12px;text-align:center}.toast{position:fixed;bottom:75px;left:50%;transform:translateX(-50%);background:#493d4a;color:#fff;padding:12px 18px;border-radius:24px;opacity:0;transition:.2s}.toast.show{opacity:1}
</style></head><body>
<header><div><h1>🐼 Vibely Panda Teddy</h1><small>Your little world of happiness</small></div><div class="pill">🪙 <b id="coins">120</b></div></header>
<div class="tabs"><button class="tab active" onclick="petType('panda',this)">🐼 Panda</button><button class="tab" onclick="petType('teddy',this)">🧸 Teddy</button></div>
<section class="scene"><div class="sun"></div><div class="bubble" id="mood">I'm happy to see you! 💗</div><div class="pet" id="pet">🐼</div><div class="floor"></div></section>
<div class="stats"><div class="stat">🍎 Hunger <b id="hunger">82</b><div class="bar"><i id="hbar" style="width:82%"></i></div></div><div class="stat">💖 Happiness <b id="happy">90</b><div class="bar"><i id="pbar" style="width:90%"></i></div></div><div class="stat">🛁 Clean <b id="clean">76</b><div class="bar"><i id="cbar" style="width:76%"></i></div></div></div>
<div class="actions"><div class="act" onclick="action('feed')"><b>🍓</b>Feed</div><div class="act" onclick="action('bath')"><b>🫧</b>Bath</div><div class="act" onclick="action('play')"><b>🎾</b>Play</div><div class="act" onclick="action('sleep')"><b>🌙</b>Sleep</div></div>
<div class="panel"><h3>🏡 My little home</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><button onclick="room('living')">🛋️ Living room</button><button onclick="room('garden')">🌷 Garden</button><button onclick="room('wardrobe')">👗 Wardrobe</button></div><p id="roomnote" style="color:#927e90;font-size:13px;margin-bottom:0">A cozy place to relax with your best friend.</p></div>
<div class="bottom"><span>🏠<br>Home</span><span onclick="room('garden')">🌱<br>Garden</span><span onclick="room('wardrobe')">👚<br>Style</span><span onclick="room('living')">🎮<br>Play</span></div><div class="toast" id="toast"></div>
<script>
let kind='panda',coins=120,stats={hunger:82,happy:90,clean:76},sleeping=false;
function save(){localStorage.setItem('vibely-save',JSON.stringify({kind,coins,stats}))}
try{let s=JSON.parse(localStorage.getItem('vibely-save'));if(s){kind=s.kind||kind;coins=s.coins||coins;stats=s.stats||stats;document.getElementById('pet').textContent=kind==='panda'?'🐼':'🧸';document.querySelectorAll('.tab').forEach((x,i)=>x.classList.toggle('active',(i===0)===(kind==='panda')))}}catch(e){}
function render(){document.getElementById('coins').textContent=coins;for(let k in stats){document.getElementById(k).textContent=stats[k];document.getElementById(({hunger:'hbar',happy:'pbar',clean:'cbar'})[k]).style.width=stats[k]+'%'}document.getElementById('pet').classList.toggle('sleep',sleeping)}
function msg(t){let e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1600)}
function petType(k,b){kind=k;document.getElementById('pet').textContent=k==='panda'?'🐼':'🧸';document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');msg(k==='panda'?'Panda joined the room!':'Teddy joined the room!');save()}
function action(a){sleeping=false;if(a==='feed'){stats.hunger=Math.min(100,stats.hunger+18);coins=Math.max(0,coins-5);msg('Yummy! Thank you! 🍓')}if(a==='bath'){stats.clean=100;msg('Fresh and clean! 🫧')}if(a==='play'){stats.happy=Math.min(100,stats.happy+16);stats.hunger=Math.max(0,stats.hunger-5);msg('That was so much fun! 🎾')}if(a==='sleep'){sleeping=true;stats.happy=Math.min(100,stats.happy+5);msg('Sweet dreams, little one 🌙')}render();save()}
function room(r){let t={living:'A cozy living room with your favourite friend.',garden:'Your garden is blooming. Come back every day to care for it! 🌼',wardrobe:'Pick a comfy look: Panda and Teddy are always adorable! 👒'};document.getElementById('roomnote').textContent=t[r];msg(r==='garden'?'Garden time! 🌷':r==='wardrobe'?'Style time! ✨':'Welcome home! 🏡')}
render();setInterval(()=>{if(!sleeping){stats.hunger=Math.max(0,stats.hunger-1);stats.happy=Math.max(0,stats.happy-1)}render();save()},60000);
</script></body></html>
