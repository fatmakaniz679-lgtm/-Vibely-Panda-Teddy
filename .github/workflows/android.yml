name: Build Vibely Android APK

on:
  push:
    branches: [ main ]
    paths:
      - '*.zip'
      - '**/*.zip'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Extract project ZIP
        run: |
          mkdir -p source
          ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "Project ZIP not found in repository."
            exit 1
          fi
          unzip -q "$ZIP_FILE" -d source
          BUILD_FILE="$(find source -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)"
          if [ -z "$BUILD_FILE" ]; then
            echo "Gradle settings file not found in uploaded ZIP."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$BUILD_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Install Gradle 9.3.1
        run: |
          curl -fL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      - name: Generate local debug signing keystore
        run: |
          if [ ! -f "$PROJECT_DIR/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$PROJECT_DIR/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Fix Compose Dp offset expressions
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          p = Path(os.environ["PROJECT_DIR"]) / "app/src/main/java/com/example/vibely/ui/home/VirtualHomeScreen.kt"
          if not p.is_file():
              matches = list(Path(os.environ["PROJECT_DIR"]).rglob("VirtualHomeScreen.kt"))
              if len(matches) != 1:
                  raise SystemExit(f"Could not uniquely locate VirtualHomeScreen.kt; matches={matches}")
              p = matches[0]
          s = p.read_text()
          s = s.replace("x = ((index % 5) - 2) * 54.dp,", "x = 54.dp * (((index % 5) - 2).toFloat()),")
          s = s.replace("y = ((index / 5) - 1) * 50.dp + heartFloat.dp,", "y = 50.dp * (((index / 5) - 1).toFloat()) + heartFloat.dp,")
          p.write_text(s)
          print(f"Patched Compose Dp offsets in {p}")
          PY

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
        working-directory: ${{ env.PROJECT_DIR }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vibely-Panda-Teddy-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
